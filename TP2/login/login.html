<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/navBar.css">
    <link rel="stylesheet" href="formLogin.css">
    <title>GamingTeam - Login</title>
</head>
<body>
    <header class="navBar">
        <nav>
            <!--izquierda-->
            <div class="izquierda">
                <img src="../assets/img/menu.png" alt="menu" class="menu"> 
                <img src="../assets/img/logo.png" alt="logo" class="logo"> 
            </div>

            <!--centro-->
            <div class="buscador">
                <form action="search.html" method="get">
                    <input type="text" name="buscador" placeholder="Buscar un juego...">
                    <button type="submit" class="lupa-btn" aria-label="Buscar">
                        
                    </button>
                </form>
            </div>

            <!--derecha-->
            <div class="derecha">
                <span class="saludo-usuario">Hola, Usuario</span>
                <img src="../assets/img/user.png" alt="user" class="user">
            </div>
        </nav>
    </header>

    <div class="form-login">
        <h2 class="form-title">Inicio de sesión</h2>
        <form action="login.html" method="post">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" name="email" placeholder="ejemplo@gamingteam.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" placeholder="Introduzca su contraseña" required>
            </div>    
                <button type="submit" class="btn-submit">Iniciar sesión</button>

                <p class="text-social">Ingresar con cuenta de Facebook / Google</p>
                <div class="social-container">
                    <a href="#" class="social-link"><img src="../assets/img/facebook.png" alt="Facebook" class="social"></a>
                    <a href="#" class="social-link"><img src="../assets/img/google.png" alt="Google" class="social"></a>
                </div>
                <p class="text-social">¿No tenés cuenta?</p> <p class="text-link"> <a href="register.html"> Regístrate acá</a></p>
                
            </form>
        </div>


    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/navBar.css">
    <link rel="stylesheet" href="formLogin.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">    
    <title>GamingTeam - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navBar">
        <nav>
            <!--izquierda-->
            <div class="izquierda">
                <img src="../assets/img/menu.png" alt="menu" class="menu"> 
                <a href="../index.html">
                    <img src="../assets/img/logo.png" alt="logo" class="logo">
                </a>           
             </div>

            <!--centro-->
            <div class="buscador">
                <form action="search.html" method="get">
                    <input type="text" name="buscador" placeholder="Buscar un juego...">
                    <button type="submit" class="lupa-btn" aria-label="Buscar">
                        
                    </button>
                </form>
            </div>

            <!--derecha-->
            <div class="derecha">
                <span class="saludo-usuario">Hola, Usuario</span>
                <img src="../assets/img/user.png" alt="user" class="user">
            </div>
        </nav>
    </header>

    <div class="form-login">
        <h2 class="form-title">Inicio de sesión</h2>
        
        <!-- Agregamos un ID al formulario para controlarlo con JS -->
        <form id="loginForm" action="../index.html" method="get">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@gamingteam.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Introduzca su contraseña" required>
            </div>    
            
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">Iniciar sesión</span>
                <!-- Spinner oculto por defecto que se activa con JS -->
                <div class="spinner" style="display: none;"></div>
            </button>

            <p class="text-social">O ingresa con</p>
            <div class="social-container">
                <a href="#" class="social-btn facebook-btn">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </a>
                <a href="#" class="social-btn google-btn">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </a>
            </div>
    
            <p class="text-footer">
                ¿No tenés cuenta? <a href="../register/register.html" class="text-link"> Regístrate acá</a>
            </p>
        </form>

        <!-- Mensaje de éxito oculto (Animado por CSS/JS) -->
        <div id="successMessage" class="success-message" style="display: none;">
            <i class="fas fa-check-circle"></i>
            <h3>¡Inicio de sesión exitoso!</h3>
            <p>Redirigiendo a GamingTeam...</p>
        </div>
    </div>

    <!-- Script para simular la animación y validación -->
    <script src="loginAnimation.js"></script>
</body>
</html>

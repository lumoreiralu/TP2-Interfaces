<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/navBar.css">
    <link rel="stylesheet" href="css/juegoDestacado.css">
    <link rel="stylesheet" href="css/carrusel.css">

    <title>GamingTeam</title>
</head>
<body>
    <header class="navBar">
        <nav>
            <!--izquierda-->
            <div class="izquierda">
                <img src="assets/img/menu.png" alt="menu" class="menu"> 
                <img src="assets/img/logo.png" alt="logo" class="logo"> 
            </div>

            <!--centro-->
            <div class="buscador">
                <form action="search.html" method="get">
                    <input type="text" name="buscador" placeholder="Buscar un juego...">
                    <button type="submit" class="lupa-btn" aria-label="Buscar">
                        
                    </button>
                </form>
            </div>

            <!--derecha-->
            <div class="derecha">
                <span class="saludo-usuario">Hola, Usuario</span>
                <img src="assets/img/user.png" alt="user" class="user">
            </div>
        </nav>
    </header>


    <div class="juego-destacado">  
        <h2 class="subtitulo">Juego Destacado del Mes</h2>

        <div class="pegSolitaire-home">
            <button class="btn-start">START</button>
        </div>
    </div>


    <div class="seccion-carrusel">
        <h3 class="titulo-carrusel">Recomendados Para Ti</h3>

        <div class="carrusel-contenedor">
            <!-- Botón Izquierdo -->
            <button class="btn-carrusel-prev"><img src="assets/img/botonIzquierdaCarrusel.png" alt="" class="btn-carrusel"></button>

            <!-- La fila que contiene los juegos y se va a recortar -->
            <div class="carrusel-track">
                <div class="juego-tarjeta"><img src="assets/img/fancyPants.png" alt="Stickman"></div>
                <div class="juego-tarjeta"><img src="assets/img/motoTrap.png" alt="Moto"></div>
                <div class="juego-tarjeta"><img src="assets/img/tastyPlanet.png" alt="Monstruo"></div>
                <div class="juego-tarjeta"><img src="assets/img/fireboyWatergirl.png" alt="Fireboy Watergirl"></div>
                <div class="juego-tarjeta"><img src="assets/img/fancyPants.png" alt="Stickman"></div>
                <div class="juego-tarjeta"><img src="assets/img/motoTrap.png" alt="Moto"></div>
                <div class="juego-tarjeta"><img src="assets/img/tastyPlanet.png" alt="Monstruo"></div>
                <div class="juego-tarjeta"><img src="assets/img/fireboyWatergirl.png" alt="Fireboy Watergirl"></div>
                <div class="juego-tarjeta"><img src="assets/img/fancyPants.png" alt="Stickman"></div>
                <div class="juego-tarjeta"><img src="assets/img/motoTrap.png" alt="Moto"></div>
                <div class="juego-tarjeta"><img src="assets/img/tastyPlanet.png" alt="Monstruo"></div>
                <div class="juego-tarjeta"><img src="assets/img/fireboyWatergirl.png" alt="Fireboy Watergirl"></div>
                <div class="juego-tarjeta"><img src="assets/img/fancyPants.png" alt="Stickman"></div>
                <div class="juego-tarjeta"><img src="assets/img/motoTrap.png" alt="Moto"></div>
                <div class="juego-tarjeta"><img src="assets/img/tastyPlanet.png" alt="Monstruo"></div>
                <div class="juego-tarjeta"><img src="assets/img/fireboyWatergirl.png" alt="Fireboy Watergirl"></div>
            </div>
            <!-- Botón Derecho -->
            <button class="btn-carrusel-next"><img src="assets/img/botonDerechaCarrusel.png" alt="" class="btn-carrusel"></button>
        </div>
    </div>
</body>
</html>

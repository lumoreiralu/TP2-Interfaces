<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/navBar.css">
    <link rel="stylesheet" href="formRegister.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">    <title>GamingTeam - Register</title>
</head>
<body>
    <header class="navBar">
        <nav>
            <!--izquierda-->
            <div class="izquierda">
                <img src="../assets/img/menu.png" alt="menu" class="menu"> 
                <img src="../assets/img/logo.png" alt="logo" class="logo"> 
            </div>

            <!--centro-->
            <div class="buscador">
                <form action="search.html" method="get">
                    <input type="text" name="buscador" placeholder="Buscar un juego...">
                    <button type="submit" class="lupa-btn" aria-label="Buscar">
                        
                    </button>
                </form>
            </div>

            <!--derecha-->
            <div class="derecha">
                <span class="saludo-usuario">Hola, Usuario</span>
                <img src="../assets/img/user.png" alt="user" class="user">
            </div>
        </nav>
    </header>


    <div class="form-register">
        <h2 class="form-title">Formulario de Registro</h2>
        <form action="register.html" method="post">
            <div class="input-group">
                <label for="nombre">Nombre <span class="required">*</span></label>
                <input type="text" name="nombre" placeholder="Ingrese su nombre." required>
            </div>
            <div class="input-group">
                <label for="apellido">Apellido <span class="required">*</span></label>
                <input type="text" name="apellido" placeholder="Ingrese su apellido." required>
            </div>
            <div class="input-group">
                <label for="nombreUsuario">Nombre de Usuario </label>
                <input type="text" name="nombreUsuario" placeholder="Elija un apodo para su cuenta." required>
            </div>
            <div class="input-group">
                <label for="edad">Edad <span class="required">*</span></label>
                <input type="text" name="edad" placeholder="Ingrese su edad" required>
            </div>
            <div class="input-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" name="email" placeholder="ejemplo@gamingteam.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña <span class="required">*</span></label>
                <input type="password" name="password" placeholder="Elija una contraseña." required>
            </div>    
             <div class="input-group">
                <label for="password">Repetir contraseña <span class="required">*</span></label>
                <input type="password" name="password" placeholder="Repita la contraseña elegida." required>
            </div> 
            <div class="captcha-container">
                <img src="../assets/img/captcha.png" alt="captcha" class="captcha"> 
            </div>
                <button type="submit" class="btn-submit">Registrarse</button>
    
                <p class="text-footer">
                    ¿Ya tenés cuenta? <a href="login.html" class="text-link"> Inicia sesión acá</a>
                </p>
    
                
        </form>



    </div>


</body>
</html>
